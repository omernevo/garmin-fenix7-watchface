<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Fenix 7 Watchface Simulator & Interactive Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@700;800;900&family=Oxanium:wght@700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: #111726;
            --panel-border: #1e293b;
            --accent-cyan: #388b9c;
            --accent-metallic: #4a9bae;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, #151d30 0%, #0d1424 100%);
            border-bottom: 1px solid var(--panel-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .badge {
            background: rgba(74, 155, 174, 0.18);
            color: #5bb3c7;
            border: 1px solid rgba(74, 155, 174, 0.35);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 480px;
            gap: 2rem;
            padding: 2rem;
            max-width: 1500px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .viewport-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .watch-container {
            position: relative;
            width: 490px;
            height: 490px;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.85));
        }

        /* Garmin Fenix 7 Metallic Titanium Bezel */
        .watch-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #f1f5f9 0%, #cbd5e1 25%, #94a3b8 55%, #64748b 80%, #475569 100%);
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.9),
                        inset 0 -5px 10px rgba(0, 0, 0, 0.85),
                        0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bezel-screw {
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #94a3b8;
            border: 1px solid #475569;
            box-shadow: inset 1px 1px 2px #0f172a, 0 1px 1px rgba(255,255,255,0.6);
        }
        .screw-tl { top: 38px; left: 70px; }
        .screw-tr { top: 38px; right: 70px; }
        .screw-bl { bottom: 38px; left: 70px; }
        .screw-br { bottom: 38px; right: 70px; }
        .screw-t { top: 15px; left: calc(50% - 4.5px); }
        .screw-b { bottom: 15px; left: calc(50% - 4.5px); }

        .watch-inner-ring {
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: #090d16;
            border: 2px solid #1e293b;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #watchfaceCanvas {
            width: 360px;
            height: 360px;
            border-radius: 50%;
            background: #000000;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.95);
        }

        .controls-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-height: 88vh;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.88rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.75px;
            color: #5bb3c7;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            background: #1e293b;
            color: var(--text-primary);
            border: 1px solid #334155;
            padding: 0.5rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            background: #334155;
            border-color: #5bb3c7;
        }

        .btn.active {
            background: #3a8a9c;
            color: #ffffff;
            border-color: #5bb3c7;
            font-weight: 700;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3a8a9c 0%, #296876 100%);
            color: #ffffff;
            font-weight: 700;
            border: 1px solid #5bb3c7;
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        input[type="text"], input[type="number"], select {
            background: #0c1220;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 0.45rem 0.65rem;
            color: #f8fafc;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #5bb3c7;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            color: #10b981;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .info-card {
            background: rgba(12, 18, 32, 0.6);
            border-radius: 8px;
            padding: 0.75rem;
            border: 1px dashed #334155;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h2>Garmin Fenix 7 Watchface</h2>
            <span class="badge">CONNECT IQ 4.x / 5.x</span>
            <span class="badge">260×260 MIP</span>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            <span>Pixel-Perfect Simulator</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- Watch Display Card -->
        <div class="viewport-card">
            <div class="watch-container">
                <div class="watch-bezel">
                    <div class="bezel-screw screw-tl"></div>
                    <div class="bezel-screw screw-tr"></div>
                    <div class="bezel-screw screw-bl"></div>
                    <div class="bezel-screw screw-br"></div>
                    <div class="bezel-screw screw-t"></div>
                    <div class="bezel-screw screw-b"></div>

                    <div class="watch-inner-ring">
                        <!-- 520x520 canvas for retina sharpness -->
                        <canvas id="watchfaceCanvas" width="520" height="520"></canvas>
                    </div>
                </div>
            </div>

            <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; justify-content: center;">
                <span style="font-size: 0.85rem; color: var(--text-secondary);">Quick Presets:</span>
                <button class="btn" onclick="applyPreset('photo1')">Photo 1 (Active 09:07:39)</button>
                <button class="btn" onclick="applyPreset('photo2')">Photo 2 (Rest 09:16)</button>
                <button class="btn" onclick="applyPreset('live')">Live Clock</button>
            </div>
        </div>

        <!-- Controls & Configuration Panel -->
        <div class="controls-panel">
            <div>
                <div class="section-title">Display Mode & Power State</div>
                <div class="btn-group" style="margin-top: 0.6rem;">
                    <button id="btnActive" class="btn active" onclick="setMode(true)">Active Mode (Seconds at Rim)</button>
                    <button id="btnRest" class="btn" onclick="setMode(false)">Rest / Sleep (Line at Rim)</button>
                </div>
            </div>

            <div>
                <div class="section-title">Time Controls</div>
                <div class="grid-3" style="margin-top: 0.6rem;">
                    <div class="form-row">
                        <label class="form-label">Hour</label>
                        <input id="inputHour" type="number" min="0" max="23" value="9" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Minute</label>
                        <input id="inputMin" type="number" min="0" max="59" value="7" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Second</label>
                        <input id="inputSec" type="number" min="0" max="59" value="39" oninput="updateData()">
                    </div>
                </div>
                <div class="form-row" style="margin-top: 0.6rem;">
                    <label class="form-label">Date String (6:00 Bottom)</label>
                    <input id="inputDateStr" type="text" value="MON AUG 17" oninput="updateData()">
                </div>
                <div class="form-row" style="margin-top: 0.6rem;">
                    <label class="form-label">Israel Time (10:00 Top-Left)</label>
                    <input id="inputIsraelTime" type="text" value="ISR 10:07" oninput="updateData()">
                </div>
            </div>

            <div>
                <div class="section-title">
                    <span>OpenWeatherMap Live API</span>
                    <button class="btn btn-primary" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="fetchLiveWeather()">Fetch Live</button>
                </div>
                <div class="form-row" style="margin-top: 0.6rem;">
                    <label class="form-label">API Key</label>
                    <input id="inputApiKey" type="text" value="767c5a6ab53c51d09cbc74d3adc63a3f">
                </div>
                <div class="grid-3" style="margin-top: 0.6rem;">
                    <div class="form-row">
                        <label class="form-label">Cur Temp (°C)</label>
                        <input id="inputCurTemp" type="number" value="18" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Min/Max</label>
                        <input id="inputMinMax" type="text" value="21/17" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Condition</label>
                        <select id="inputCondition" onchange="updateData()">
                            <option value="Clouds">Cloudy</option>
                            <option value="Clear">Sunny / Clear</option>
                            <option value="Rain">Rain</option>
                            <option value="Thunderstorm">Thunderstorm</option>
                            <option value="Snow">Snow</option>
                            <option value="Mist">Mist / Fog</option>
                        </select>
                    </div>
                </div>
                <div class="grid-2" style="margin-top: 0.6rem;">
                    <div class="form-row">
                        <label class="form-label">Precipitation (2:00)</label>
                        <input id="inputPrecip" type="text" value="100% 0mm" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Wind (12:00 Top)</label>
                        <input id="inputWind" type="text" value="13 NW" oninput="updateData()">
                    </div>
                </div>
                <div class="form-row" style="margin-top: 0.6rem;">
                    <label class="form-label">Next Sun Event</label>
                    <input id="inputSunEvent" type="text" value="20:31" oninput="updateData()">
                </div>
            </div>

            <div>
                <div class="section-title">Activity & Fitness Data</div>
                <div class="grid-2" style="margin-top: 0.6rem;">
                    <div class="form-row">
                        <label class="form-label">Weekly Steps (4:00)</label>
                        <input id="inputWeeklySteps" type="text" value="STEP 7.3k" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Weekly Bike (8:00)</label>
                        <input id="inputWeeklyBike" type="text" value="BIKE 9.0" oninput="updateData()">
                    </div>
                </div>
                <div class="grid-3" style="margin-top: 0.6rem;">
                    <div class="form-row">
                        <label class="form-label">Elevation (m)</label>
                        <input id="inputElevation" type="number" value="132" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Intensity Min</label>
                        <input id="inputIntensity" type="number" value="35" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Today Steps</label>
                        <input id="inputTodaySteps" type="text" value="7.3k" oninput="updateData()">
                    </div>
                </div>
                <div class="grid-2" style="margin-top: 0.6rem;">
                    <div class="form-row">
                        <label class="form-label">Current HR (bpm)</label>
                        <input id="inputCurHR" type="number" value="61" oninput="updateData()">
                    </div>
                    <div class="form-row">
                        <label class="form-label">7-Day Avg RHR</label>
                        <input id="inputRHR" type="number" value="46" oninput="updateData()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('watchfaceCanvas');
        const ctx = canvas.getContext('2d');

        let isAwake = true;
        let isLiveTime = false;

        const state = {
            hour: 9,
            min: 7,
            sec: 39,
            wind: "13 NW",
            precip: "100% 0mm",
            weeklySteps: "STEP 7.3k",
            dateStr: "MON AUG 17",
            weeklyBike: "BIKE 9.0",
            israelTime: "ISR 10:07",
            curTemp: "18",
            elevation: "132",
            minMax: "21/17",
            condition: "Clouds",
            sunEvent: "20:31",
            intensity: "35",
            curHR: "61",
            todaySteps: "7.3k",
            rhr: "46"
        };

        function setMode(awake) {
            isAwake = awake;
            document.getElementById('btnActive').classList.toggle('active', isAwake);
            document.getElementById('btnRest').classList.toggle('active', !isAwake);
            renderWatchface();
        }

        function applyPreset(preset) {
            isLiveTime = false;
            if (preset === 'photo1') {
                isAwake = true;
                state.hour = 9;
                state.min = 7;
                state.sec = 39;
                state.israelTime = "ISR 10:07";
                state.curHR = "61";
                state.condition = "Clouds";
            } else if (preset === 'photo2') {
                isAwake = false;
                state.hour = 9;
                state.min = 16;
                state.sec = 0;
                state.israelTime = "ISR 10:16";
                state.curHR = "63";
                state.condition = "Clouds";
            } else if (preset === 'live') {
                isLiveTime = true;
            }
            syncInputsFromState();
            setMode(isAwake);
        }

        function syncInputsFromState() {
            document.getElementById('inputHour').value = state.hour;
            document.getElementById('inputMin').value = state.min;
            document.getElementById('inputSec').value = state.sec;
            document.getElementById('inputWind').value = state.wind;
            document.getElementById('inputPrecip').value = state.precip;
            document.getElementById('inputWeeklySteps').value = state.weeklySteps;
            document.getElementById('inputDateStr').value = state.dateStr;
            document.getElementById('inputWeeklyBike').value = state.weeklyBike;
            document.getElementById('inputIsraelTime').value = state.israelTime;
            document.getElementById('inputCurTemp').value = state.curTemp;
            document.getElementById('inputElevation').value = state.elevation;
            document.getElementById('inputMinMax').value = state.minMax;
            document.getElementById('inputCondition').value = state.condition;
            document.getElementById('inputSunEvent').value = state.sunEvent;
            document.getElementById('inputIntensity').value = state.intensity;
            document.getElementById('inputCurHR').value = state.curHR;
            document.getElementById('inputTodaySteps').value = state.todaySteps;
            document.getElementById('inputRHR').value = state.rhr;
        }

        function updateData() {
            isLiveTime = false;
            state.hour = parseInt(document.getElementById('inputHour').value) || 0;
            state.min = parseInt(document.getElementById('inputMin').value) || 0;
            state.sec = parseInt(document.getElementById('inputSec').value) || 0;
            state.wind = document.getElementById('inputWind').value;
            state.precip = document.getElementById('inputPrecip').value;
            state.weeklySteps = document.getElementById('inputWeeklySteps').value;
            state.dateStr = document.getElementById('inputDateStr').value;
            state.weeklyBike = document.getElementById('inputWeeklyBike').value;
            state.israelTime = document.getElementById('inputIsraelTime').value;
            state.curTemp = document.getElementById('inputCurTemp').value;
            state.elevation = document.getElementById('inputElevation').value;
            state.minMax = document.getElementById('inputMinMax').value;
            state.condition = document.getElementById('inputCondition').value;
            state.sunEvent = document.getElementById('inputSunEvent').value;
            state.intensity = document.getElementById('inputIntensity').value;
            state.curHR = document.getElementById('inputCurHR').value;
            state.todaySteps = document.getElementById('inputTodaySteps').value;
            state.rhr = document.getElementById('inputRHR').value;
            renderWatchface();
        }

        async function fetchLiveWeather() {
            const apiKey = document.getElementById('inputApiKey').value;
            if (!apiKey) return;
            try {
                const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=32.0853&lon=34.7818&appid=${apiKey}&units=metric`);
                if (!res.ok) throw new Error('API error');
                const data = await res.json();
                
                if (data.weather && data.weather.length > 0) {
                    state.condition = data.weather[0].main;
                }
                if (data.main) {
                    state.curTemp = Math.round(data.main.temp).toString();
                    state.minMax = `${Math.round(data.main.temp_max)}/${Math.round(data.main.temp_min)}`;
                }
                if (data.wind) {
                    const speed = Math.round(data.wind.speed * 3.6);
                    const deg = data.wind.deg || 0;
                    const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
                    const dir = dirs[Math.round(deg / 22.5) % 16];
                    state.wind = `${speed} ${dir}`;
                }
                if (data.rain && data.rain['1h']) {
                    state.precip = `100% ${Math.round(data.rain['1h'])}mm`;
                }
                if (data.sys && data.sys.sunset) {
                    const d = new Date(data.sys.sunset * 1000);
                    state.sunEvent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                }
                syncInputsFromState();
                renderWatchface();
                alert('Live weather updated successfully from OpenWeatherMap!');
            } catch (err) {
                alert('Failed to fetch from OpenWeatherMap: ' + err.message);
            }
        }

        // --- Watchface Rendering Pipeline ---
        function renderWatchface() {
            if (isLiveTime) {
                const now = new Date();
                state.hour = now.getHours();
                state.min = now.getMinutes();
                state.sec = now.getSeconds();
                document.getElementById('inputHour').value = state.hour;
                document.getElementById('inputMin').value = state.min;
                document.getElementById('inputSec').value = state.sec;
            }

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // Background
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, w, h);

            // Palette
            const METALLIC_CYAN = "#388b9c";
            const METALLIC_CYAN_TICK = "#3ea3b8";
            const WHITE = "#FFFFFF";
            const GRAY_DIVIDER = "#4a5568";

            // --- 1. Metallic Divider Ticks at 1, 3, 5, 7, 9, 11 o'clock ---
            ctx.lineWidth = 6;
            ctx.strokeStyle = METALLIC_CYAN_TICK;
            ctx.fillStyle = METALLIC_CYAN_TICK;

            const rOuter = cx * 0.96;
            const rInner = cx * 0.86;

            const clockTicksHours = [1, 5, 7, 11];
            clockTicksHours.forEach(hour => {
                const angleDeg = hour * 30;
                const rad = angleDeg * Math.PI / 180;
                
                const x1 = cx + rInner * Math.sin(rad);
                const y1 = cy - rInner * Math.cos(rad);
                const x2 = cx + rOuter * Math.sin(rad);
                const y2 = cy - rOuter * Math.cos(rad);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            });

            // 9 o'clock tick: Left horizontal bar at the rim (270°)
            ctx.fillRect(cx - rOuter, cy - 3, (rOuter - rInner), 6);

            // 3 o'clock position: Right horizontal (90°)
            if (isAwake) {
                const secStr = String(state.sec).padStart(2, '0');
                ctx.fillStyle = METALLIC_CYAN_TICK;
                ctx.font = "700 22px 'Rajdhani', sans-serif";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillText(secStr, cx + rOuter - 2, cy);
            } else {
                ctx.fillRect(cx + rInner, cy - 3, (rOuter - rInner), 6);
            }

            // --- 2. Perimeter Data Fields along the rim ---
            ctx.fillStyle = WHITE;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "700 20px 'Rajdhani', sans-serif";

            // 12:00 Top: Wind
            ctx.fillText(state.wind, cx, cy * 0.12);

            // 2:00 Top Right: Precip
            ctx.fillText(state.precip, cx * 1.44, cy * 0.30);

            // 10:00 Top Left: Israel Time
            ctx.fillText(state.israelTime, cx * 0.56, cy * 0.30);

            // 8:00 Bottom Left: Weekly Bike
            ctx.fillText(state.weeklyBike, cx * 0.54, cy * 1.62);

            // 6:00 Bottom: Date
            ctx.fillText(state.dateStr, cx, cy * 1.82);

            // 4:00 Bottom Right: Weekly Steps
            ctx.fillText(state.weeklySteps, cx * 1.46, cy * 1.62);

            // --- 3. Upper Data Area ---
            // Current Temp (top, under wind)
            ctx.fillStyle = WHITE;
            ctx.font = "700 24px 'Rajdhani', sans-serif";
            ctx.fillText(state.curTemp, cx, cy * 0.25);

            const upperRowY = cy * 0.50;
            const upperIconY = upperRowY - 14;
            const upperTextY = upperRowY + 10;

            const col1X = cx * 0.58;
            const col2X = cx;
            const col3X = cx * 1.42;

            // Col 1: Elevation + Mountain icon
            drawMountainIcon(col1X, upperIconY, WHITE);
            ctx.fillStyle = WHITE;
            ctx.font = "700 20px 'Rajdhani', sans-serif";
            ctx.fillText(state.elevation, col1X, upperTextY);

            // Col 2: Min/Max + Dynamic Weather Condition icon
            drawWeatherConditionIcon(col2X, upperIconY, state.condition, WHITE);
            ctx.fillStyle = WHITE;
            ctx.fillText(state.minMax, col2X, upperTextY);

            // Col 3: Sun Event + Sun icon
            drawSunIcon(col3X, upperIconY, WHITE);
            ctx.fillStyle = WHITE;
            ctx.fillText(state.sunEvent, col3X, upperTextY);

            // Upper Vertical Dividers (Grey)
            ctx.strokeStyle = GRAY_DIVIDER;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx * 0.79, upperIconY - 6);
            ctx.lineTo(cx * 0.79, upperTextY + 12);
            ctx.moveTo(cx * 1.21, upperIconY - 6);
            ctx.lineTo(cx * 1.21, upperTextY + 12);
            ctx.stroke();

            // --- 4. Center Main Time Display (PERFECTLY CENTERED) ---
            const hourStr = String(state.hour).padStart(2, '0');
            const minStr = String(state.min).padStart(2, '0');

            const timeFont = "800 114px 'Orbitron', 'Oxanium', sans-serif";
            ctx.font = timeFont;
            ctx.textBaseline = "middle";

            const hourW = ctx.measureText(hourStr).width;
            const minW = ctx.measureText(minStr).width;
            const timeGap = 8;
            const totalTimeW = hourW + timeGap + minW;

            const startX = cx - (totalTimeW / 2);
            const timeY = cy * 0.94;

            // Hours: Solid Filled White (Centered)
            ctx.fillStyle = WHITE;
            ctx.textAlign = "left";
            ctx.fillText(hourStr, startX, timeY);

            // Minutes: Hollow Outlined White (Centered)
            const minX = startX + hourW + timeGap;
            ctx.lineWidth = 5;
            ctx.strokeStyle = WHITE;
            ctx.strokeText(minStr, minX, timeY);
            ctx.fillStyle = "#000000";
            ctx.fillText(minStr, minX, timeY);

            // --- 5. Lower Data Area ---
            const lowerRowY = cy * 1.22;
            const lowerTextY = lowerRowY - 6;
            const lowerIconY = lowerRowY + 16;

            // Col 1: Weekly Intensity
            ctx.fillStyle = WHITE;
            ctx.font = "700 20px 'Rajdhani', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(state.intensity, col1X, lowerTextY);
            drawIntensityIcon(col1X, lowerIconY, WHITE);

            // Col 2: Current Heart Rate
            ctx.fillText(state.curHR, col2X, lowerTextY);
            drawHeartIcon(col2X, lowerIconY, WHITE);

            // Col 3: Today's Steps
            ctx.fillText(state.todaySteps, col3X, lowerTextY);
            drawFootstepsIcon(col3X, lowerIconY, WHITE);

            // Lower Vertical Dividers (Grey)
            ctx.strokeStyle = GRAY_DIVIDER;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx * 0.79, lowerTextY - 10);
            ctx.lineTo(cx * 0.79, lowerIconY + 10);
            ctx.moveTo(cx * 1.21, lowerTextY - 10);
            ctx.lineTo(cx * 1.21, lowerIconY + 10);
            ctx.stroke();

            // 7-Day Average Resting Heart Rate (Bottom center under heart icon)
            ctx.fillStyle = WHITE;
            ctx.font = "700 20px 'Rajdhani', sans-serif";
            ctx.fillText(state.rhr, col2X, cy * 1.48);
        }

        // --- Vector Icon Drawing Functions ---
        function drawMountainIcon(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y - 7);
            ctx.lineTo(x - 8, y + 5);
            ctx.lineTo(x + 5, y + 5);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x + 3, y - 3);
            ctx.lineTo(x - 1, y + 5);
            ctx.lineTo(x + 8, y + 5);
            ctx.fill();

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x - 2, y);
            ctx.lineTo(x + 2, y + 2);
            ctx.stroke();
        }

        function drawWeatherConditionIcon(x, y, condition, color) {
            ctx.fillStyle = color;
            ctx.strokeStyle = color;

            if (condition === "Clear") {
                // Clear Sun
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
                // Rays
                ctx.beginPath();
                ctx.moveTo(x, y - 7); ctx.lineTo(x, y - 5);
                ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 7);
                ctx.moveTo(x - 7, y); ctx.lineTo(x - 5, y);
                ctx.moveTo(x + 5, y); ctx.lineTo(x + 7, y);
                ctx.moveTo(x - 5, y - 5); ctx.lineTo(x - 3.5, y - 3.5);
                ctx.moveTo(x + 3.5, y + 3.5); ctx.lineTo(x + 5, y + 5);
                ctx.moveTo(x + 3.5, y - 3.5); ctx.lineTo(x + 5, y - 5);
                ctx.moveTo(x - 5, y + 5); ctx.lineTo(x - 3.5, y + 3.5);
                ctx.stroke();
            } else if (condition === "Rain" || condition === "Drizzle") {
                // Cloud with rain
                drawCloud(x, y - 2, color);
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x - 4, y + 4); ctx.lineTo(x - 5, y + 7);
                ctx.moveTo(x, y + 4); ctx.lineTo(x - 1, y + 7);
                ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + 3, y + 7);
                ctx.stroke();
            } else if (condition === "Thunderstorm") {
                // Cloud with lightning
                drawCloud(x, y - 2, color);
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + 1, y + 3); ctx.lineTo(x - 1, y + 6);
                ctx.lineTo(x + 2, y + 6); ctx.lineTo(x, y + 9);
                ctx.stroke();
            } else if (condition === "Snow") {
                drawCloud(x, y - 2, color);
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x - 3, y + 5, 1, 0, Math.PI * 2);
                ctx.arc(x + 1, y + 6, 1, 0, Math.PI * 2);
                ctx.arc(x + 4, y + 5, 1, 0, Math.PI * 2);
                ctx.fill();
            } else if (condition === "Mist" || condition === "Fog") {
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x - 6, y - 3); ctx.lineTo(x + 6, y - 3);
                ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y);
                ctx.moveTo(x - 5, y + 3); ctx.lineTo(x + 5, y + 3);
                ctx.stroke();
            } else {
                // Cloud
                drawCloud(x, y, color);
            }
        }

        function drawCloud(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x - 4, y + 1, 4, 0, Math.PI * 2);
            ctx.arc(x + 1, y, 5, 0, Math.PI * 2);
            ctx.arc(x + 6, y + 1, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x - 4, y + 1, 10, 4);
        }

        function drawSunIcon(x, y, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x - 8, y + 4);
            ctx.lineTo(x + 8, y + 4);
            ctx.stroke();

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y + 3, 5, Math.PI, 0);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x, y - 4); ctx.lineTo(x, y - 2);
            ctx.moveTo(x - 6, y - 2); ctx.lineTo(x - 3, y - 1);
            ctx.moveTo(x + 6, y - 2); ctx.lineTo(x + 3, y - 1);
            ctx.stroke();
        }

        function drawIntensityIcon(x, y, color) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x + 1, y - 5, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x + 1, y - 3); ctx.lineTo(x - 1, y + 1);
            ctx.moveTo(x - 1, y + 1); ctx.lineTo(x - 5, y + 5);
            ctx.moveTo(x - 1, y + 1); ctx.lineTo(x + 4, y + 5);
            ctx.moveTo(x, y - 1); ctx.lineTo(x - 4, y);
            ctx.moveTo(x, y - 1); ctx.lineTo(x + 4, y - 2);
            ctx.stroke();
        }

        function drawHeartIcon(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x - 3, y - 2, 3, 0, Math.PI * 2);
            ctx.arc(x + 3, y - 2, 3, 0, Math.PI * 2);
            ctx.moveTo(x - 6, y - 1);
            ctx.lineTo(x + 6, y - 1);
            ctx.lineTo(x, y + 6);
            ctx.fill();

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(x - 5, y);
            ctx.lineTo(x - 1.5, y);
            ctx.lineTo(x - 0.8, y - 2.5);
            ctx.lineTo(x + 0.8, y + 2.5);
            ctx.lineTo(x + 1.5, y);
            ctx.lineTo(x + 5, y);
            ctx.stroke();
        }

        function drawFootstepsIcon(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x - 3, y + 2, 2.2, 0, Math.PI * 2);
            ctx.arc(x - 4, y - 2, 1.8, 0, Math.PI * 2);
            ctx.arc(x + 3, y, 2.2, 0, Math.PI * 2);
            ctx.arc(x + 2, y - 4, 1.8, 0, Math.PI * 2);
            ctx.fill();
        }

        // Loop for live clock ticks
        setInterval(() => {
            if (isLiveTime) {
                renderWatchface();
            }
        }, 1000);

        // Initial render
        applyPreset('photo1');
    </script>
</body>
